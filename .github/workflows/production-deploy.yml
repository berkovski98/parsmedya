name: Production Deploy

on:
  # Auto-deploy is disabled. Never add push or pull_request triggers.
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Commit SHA
        required: false
        type: string

concurrency:
  group: parsmedya-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.26.2'
  APP_ROOT: /home/parsmedya/parsmedya-app
  STAGING_ROOT: /home/parsmedya/deployments/incoming

jobs:
  deploy:
    name: Build and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate deploy SHA
        env:
          DEPLOY_SHA: ${{ github.event.inputs.deploy_sha }}
        run: |
          if [ -n "$DEPLOY_SHA" ]; then
            case "$DEPLOY_SHA" in
              *[!0-9a-fA-F]* | "")
                echo "Invalid commit SHA."
                exit 1
                ;;
            esac
            if [ "${#DEPLOY_SHA}" -ne 40 ]; then
              echo "Commit SHA must be 40 hex characters."
              exit 1
            fi
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.deploy_sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${PNPM_VERSION} --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write version candidate
        run: GITHUB_SHA=$(git rev-parse HEAD) node scripts/write-version.mjs

      - name: Run tests
        run: pnpm test

      - name: Run lint
        run: pnpm lint

      - name: Production build
        env:
          NEXT_PUBLIC_SITE_URL: https://parsmedya.net
          NEXT_PUBLIC_ANALYTICS_ENABLED: 'true'
          ANALYTICS_ENABLED: 'true'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm build

      - name: Prepare standalone deploy directory
        run: node scripts/prepare-deploy.mjs

      - name: Upload to staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.CPANEL_SFTP_HOST }}
          username: ${{ secrets.CPANEL_SFTP_USERNAME }}
          key: ${{ secrets.CPANEL_SFTP_PRIVATE_KEY }}
          port: ${{ secrets.CPANEL_SFTP_PORT }}
          source: ".deploy/*"
          target: ${{ env.STAGING_ROOT }}
          rm: true
          strip_components: 1
          overwrite: true

      - name: Promote files to production
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.CPANEL_SFTP_HOST }}
          username: ${{ secrets.CPANEL_SFTP_USERNAME }}
          key: ${{ secrets.CPANEL_SFTP_PRIVATE_KEY }}
          port: ${{ secrets.CPANEL_SFTP_PORT }}
          script: |
            set -euo pipefail
            APP="/home/parsmedya/parsmedya-app"
            IN="/home/parsmedya/deployments/incoming"
            test -f "$IN/server.js"
            test -f "$IN/package.json"
            test -f "$IN/version.candidate.json"
            test -d "$IN/.next"
            mkdir -p "$APP/tmp"
            python3 - <<'PY'
            from pathlib import Path
            import shutil

            src = Path("/home/parsmedya/deployments/incoming")
            dst = Path("/home/parsmedya/parsmedya-app")
            protected = {".env", "tmp", "logs", ".git", ".htaccess", "version.json"}

            def protected_name(name: str) -> bool:
                return name in protected or name.startswith(".env.")

            for item in src.iterdir():
                if protected_name(item.name):
                    continue
                target = dst / item.name
                if item.is_dir():
                    if target.exists():
                        shutil.rmtree(target)
                    shutil.copytree(item, target, symlinks=True)
                else:
                    shutil.copy2(item, target)

            src_names = {item.name for item in src.iterdir()}
            for item in dst.iterdir():
                if protected_name(item.name) or item.name in src_names:
                    continue
                if item.is_dir():
                    shutil.rmtree(item)
                else:
                    item.unlink()
            PY

      - name: Restart Passenger
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.CPANEL_SFTP_HOST }}
          username: ${{ secrets.CPANEL_SFTP_USERNAME }}
          key: ${{ secrets.CPANEL_SFTP_PRIVATE_KEY }}
          port: ${{ secrets.CPANEL_SFTP_PORT }}
          script: |
            set -euo pipefail
            APP="/home/parsmedya/parsmedya-app"
            mkdir -p "$APP/tmp"
            test -f "$APP/server.js"
            test -f "$APP/version.json"
            touch "$APP/tmp/restart.txt"

      - name: Health check /
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors https://parsmedya.net/ >/dev/null

      - name: Health check /en
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors https://parsmedya.net/en >/dev/null

      - name: Health check /sitemap.xml
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors https://parsmedya.net/sitemap.xml >/dev/null

      - name: Health check /robots.txt
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors https://parsmedya.net/robots.txt >/dev/null

      - name: Health check /admin/login
        run: curl -fsS --retry 10 --retry-delay 3 --retry-all-errors https://parsmedya.net/admin/login >/dev/null

      - name: Verify production sitemaps
        run: node scripts/verify-sitemaps.mjs https://parsmedya.net

      - name: Confirm production version
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.CPANEL_SFTP_HOST }}
          username: ${{ secrets.CPANEL_SFTP_USERNAME }}
          key: ${{ secrets.CPANEL_SFTP_PRIVATE_KEY }}
          port: ${{ secrets.CPANEL_SFTP_PORT }}
          script: |
            set -euo pipefail
            APP="/home/parsmedya/parsmedya-app"
            IN="/home/parsmedya/deployments/incoming"
            test -f "$IN/version.candidate.json"
            python3 - <<'PY'
            import json
            from datetime import datetime, timezone
            from pathlib import Path

            app = Path("/home/parsmedya/parsmedya-app")
            incoming = Path("/home/parsmedya/deployments/incoming")
            candidate = json.loads((incoming / "version.candidate.json").read_text())
            installed_path = app / "version.json"
            try:
                installed = json.loads(installed_path.read_text())
            except Exception:
                installed = {}

            try:
                build = int(str(installed.get("build") or "0").strip() or "0")
            except ValueError:
                build = 0
            if build < 0:
                build = 0

            confirmed = {
                "version": candidate.get("version") or installed.get("version") or "0.0.0",
                "build": str(build + 1),
                "commit": candidate.get("commit") or "",
                "releasedAt": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%S.000Z"),
                "releaseTitle": candidate.get("releaseTitle") or "",
                "releaseNotes": candidate.get("releaseNotes") or [],
            }
            confirmed["createdAt"] = confirmed["releasedAt"]
            installed_path.write_text(json.dumps(confirmed, indent=2) + "\n")
            print(f"Confirmed production version {confirmed['version']} build {confirmed['build']}")
            PY
